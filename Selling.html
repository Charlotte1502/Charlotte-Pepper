<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Selling</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
        font-size: 16px;
        font-weight: normal;
        color: #333;
    }

    body {
        background: #f8f7f5;
        padding: 30px;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
    }

    h1 {
        text-align: left;
        margin-bottom: 30px;
    }

    .gallery {
        columns: 5;
        column-gap: 18px;
        flex: 1;
    }

    .gallery-item {
        display: inline-block;
        width: 100%;
        margin-bottom: 18px;
        break-inside: avoid;
        overflow: hidden;
        border-radius: 12px;
        cursor: pointer;
    }

    .gallery-item img {
        width: 100%;
        display: block;
        border-radius: 12px;
        transition: transform 0.3s ease;
    }

    .gallery-item:hover img {
        transform: scale(1.04);
    }

    @media (max-width: 1000px) {
        .gallery { columns: 4; }
    }

    @media (max-width: 700px) {
        .gallery { columns: 3; }
    }

    @media (max-width: 450px) {
        .gallery { columns: 2; }
    }

    .copyright {
        text-align: center;
        font-size: 16px;
        font-weight: normal;
        letter-spacing: normal;
        margin-top: 40px;
        padding: 20px 0 5px;
        color: #333;
    }
</style>
</head>

<body>

<h1>Selling</h1>

<div class="gallery">

    <a href="November.html" class="gallery-item">
        <img src="November.jpg" alt="November.jpg">
    </a>

</div>

<footer class="copyright">
    ALL IMAGES AND SITE CONTENT COPYRIGHT © 2026 CHARLOTTE PEPPER
</footer>

</body>
</html>
