
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Charlotte Pepper</title>

<link rel="stylesheet" href="styles.css">

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
    }

    body {
        background: #f8f7f5;
        padding: 15px 30px;
    }

    /* Header */
    header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
    }

    /* Logo / Name */
    .logo {
        font-size: 19px;
        font-weight: normal;
        color: #222;
        text-decoration: none;
        letter-spacing: 0;
    }

    /* Navigation */
    .top-menu {
        display: flex;
        gap: 25px;
    }

    .top-menu a {
        font-size: 12px;
        font-weight: normal;
        color: #333;
        text-decoration: none;
    }

    /* Main image */
    .center_img {
        display: block;
        width: 100%;
        max-width: 1450px;
        height: 600px;
        object-fit: cover;
        object-position: center;
        margin: 0 auto;
    }

    /* Copyright */
    small {
        display: block;
        text-align: center;
        font-size: 9px;
        font-weight: normal;
        letter-spacing: 1px;
        margin-top: 18px;
        color: #555;
    }

    @media (max-width: 600px) {
        header {
            flex-wrap: wrap;
            gap: 12px;
        }

        .top-menu {
            gap: 15px;
        }

        .center_img {
            height: 350px;
        }
    }
</style>
</head>

<body>

<header>

    <a href="main.html" class="logo">Charlotte Pepper</a>

    <nav class="top-menu">
        <a href="main.html">Portfolio</a>
        <a href="page2.html">Request purchase</a>
    </nav>

</header>

<img 
    class="center_img"
    src="https://images.unsplash.com/photo-1470252649378-9c29740c9fa8?w=2000&q=85"
    alt="Landscape stock photograph"
>

<small>

</small>

</body>
</html>
